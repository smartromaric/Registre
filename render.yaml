# Déploiement Render — voir docs/DEPLOIEMENT.md pour le mode d'emploi complet
# et, surtout, pour les limites réelles de l'offre gratuite.
#
# Deux services et une base. Le stockage des fichiers n'est volontairement PAS
# le disque local : sur l'offre gratuite de Render le système de fichiers est
# éphémère, tout document ou photo téléversé disparaîtrait au premier
# redéploiement. Il faut donc un stockage objet compatible S3 (Cloudflare R2,
# Backblaze B2…) — voir les variables S3_* ci-dessous.

databases:
  - name: registre-db
    databaseName: registre
    user: registre
    plan: free

services:
  # --- API FastAPI ---------------------------------------------------------
  - type: web
    name: registre-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -e .
    # Les migrations tournent au démarrage : sur Render l'offre gratuite n'a
    # pas de hook de pré-déploiement, et une base en retard de migration est
    # un échec plus coûteux qu'un démarrage un peu plus long.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /openapi.json
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Câblées automatiquement depuis la base : plus rien à recopier.
      #
      # Render fournit une URL `postgresql://` sans pilote, là où SQLAlchemy en
      # déduit psycopg2 (absent) et où le moteur applicatif exige asyncpg. La
      # documentation demandait donc de réécrire le préfixe à la main, deux fois.
      # `Settings` le fait désormais tout seul (app/core/config.py), ce qui
      # supprime la manipulation la plus oubliée d'un premier déploiement.
      - key: DATABASE_URL
        fromDatabase:
          name: registre-db
          property: connectionString
      - key: DATABASE_URL_MIGRATIONS
        fromDatabase:
          name: registre-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FILE_SIGNING_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: API_PUBLIC_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Stockage objet — obligatoire ici, voir l'en-tête de ce fichier.
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        value: auto
      # Connexion Google — laisser vide tant que l'origine de production n'est
      # pas déclarée dans la console Google Cloud (l'écran affiche alors un
      # état « non configuré » honnête, le mot de passe reste utilisable).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  # --- Frontend Next.js ----------------------------------------------------
  - type: web
    name: registre-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true

  # --- Site vitrine --------------------------------------------------------
  # Un site STATIQUE, et c'est délibéré : sur l'offre gratuite, un service web
  # s'endort au bout de 15 minutes d'inactivité et le visiteur suivant attend
  # près d'une minute. Pour l'application c'est supportable — l'utilisateur sait
  # où il va. Pour une page d'accueil qui doit convaincre un inconnu, c'est
  # rédhibitoire. Un site statique, lui, ne dort jamais.
  #
  # C'est aussi pourquoi il ne partage pas le déploiement du frontend : la page
  # traînerait le service worker, l'authentification et le cache de requêtes de
  # l'application, pour rien.
  - type: web
    name: registre-site
    runtime: static
    rootDir: site
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    envVars:
      - key: NODE_VERSION
        value: "22"
      # L'adresse de l'application, vers laquelle pointent tous les appels à
      # l'action. Figée à la construction (export statique) : changer cette
      # valeur impose de relancer le déploiement du site.
      - key: NEXT_PUBLIC_APP_URL
        sync: false
    routes:
      # Export statique : les URL inconnues doivent retomber sur la page, sinon
      # un rechargement sur une ancre renvoie une 404 du serveur de fichiers.
      - type: rewrite
        source: /*
        destination: /index.html
