# Vhost nginx pour uat.upjunoo.com — environnement de recette de Registre.
#
# À installer sur le serveur :
#   sudo cp nginx-uat.upjunoo.com.conf /etc/nginx/sites-available/uat.upjunoo.com
#   sudo ln -s /etc/nginx/sites-available/uat.upjunoo.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d uat.upjunoo.com
#
# `certbot --nginx` réécrit lui-même ce fichier pour y poser le certificat et la
# redirection vers HTTPS : ne pas les écrire à la main ici, elles seraient
# dupliquées.
#
# POURQUOI TOUT SUR UNE SEULE ORIGINE.
#
# `upjunoo.com` n'a pas de DNS joker : `uat.upjunoo.com` est le seul nom
# disponible sans toucher à la zone. Les trois composants partagent donc ce nom,
# séparés par des préfixes de chemin. Ce n'est pas qu'un pis-aller : le cookie
# de session devient *same-origin*, et CORS disparaît complètement.
#
#   /            l'application (Next.js)
#   /backend/    l'API FastAPI
#   /vitrine/    le site vitrine (fichiers statiques)

server {
    listen 80;
    listen [::]:80;
    server_name uat.upjunoo.com;

    # Téléversement de photos et de classeurs Excel.
    client_max_body_size 50M;

    access_log /var/log/nginx/uat.upjunoo.com.access.log;
    error_log  /var/log/nginx/uat.upjunoo.com.error.log;

    # --- API ----------------------------------------------------------------
    # La barre finale de `proxy_pass` est ce qui RETIRE le préfixe : nginx
    # transmet `/api/v1/...` et non `/backend/api/v1/...`. L'oublier donne un
    # 404 sur toutes les routes, sans que rien n'indique la cause.
    location /backend/ {
        proxy_pass http://127.0.0.1:4001/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Sans cet en-tête, uvicorn croit servir du HTTP en clair et fabrique des
        # liens `http://` — les URL signées des documents seraient alors cassées.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    # --- Site vitrine --------------------------------------------------------
    # Pas de barre finale ici : le conteneur sert bien ses fichiers sous
    # `/vitrine/...`, puisque le site est construit avec ce `basePath`.
    location /vitrine {
        proxy_pass http://127.0.0.1:4002;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Application ---------------------------------------------------------
    # En dernier : `location /` n'attrape que ce qu'aucun préfixe plus long n'a
    # pris. nginx choisit de toute façon le préfixe le plus long, l'ordre
    # n'est donc pas fonctionnel — il est là pour la lecture.
    location / {
        proxy_pass http://127.0.0.1:4000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rechargement à chaud de Next en développement ; sans effet en
        # production, mais inoffensif et évite une surprise si le mode change.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
    }
}
